[project]
name = "lockstep"
version = "0.3.1"
description = "A harness-agnostic driver for headless coding agents; executes taskgraph (*.tg.json) DAGs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2"]

[project.scripts]
lockstep = "lockstep.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
